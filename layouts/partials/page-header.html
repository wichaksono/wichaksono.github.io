<header class="mb-10 border-b border-line pb-8">
  {{ partial "breadcrumbs.html" . }}
  {{ with .Params.icon }}
    <div class="mb-4 grid size-12 place-items-center rounded-xl border border-accent/40 bg-accent/10 text-accent-fg">
      {{ partial "icon.html" (dict "name" . "class" "size-6") }}
    </div>
  {{ end }}
  <h1 class="text-3xl font-extrabold tracking-tight text-balance text-white sm:text-4xl">{{ .Title }}</h1>
  {{ with .Params.summary }}
    <p class="mt-3 text-lg leading-relaxed text-muted">{{ . }}</p>
  {{ end }}
</header>
