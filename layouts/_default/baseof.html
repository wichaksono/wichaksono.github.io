<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>

<body class="bg-gray-950 text-gray-300 antialiased min-h-screen flex flex-col">

  <!-- Kontainer Utama -->
  <main class="w-full max-w-lg mx-auto py-8 {{ if not .IsHome }}mb-4{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>

  <!-- FOOTER -->
  <footer class="w-full max-w-lg mx-auto py-5 {{ if not .IsHome }}mb-4{{ end }}">
    <!-- Bottom -->
      <div class="mt-4 pt-4 border-t border-gray-800 flex flex-col items-center gap-4">
        <p class="text-xs text-gray-500">
          © {{ now.Year }} Wakhid Wicaksono. All rights reserved.
        </p>
      </div>
  </footer>


  <!-- Footer hanya muncul jika bukan halaman utama -->
  {{ if not .IsHome }}
    {{ partial "footer.html" . }}
  {{ end }}

{{ $wa := .Site.Params.contact_whatsapp }}

<div id="contact-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60">
  <div class="bg-gray-900 rounded-xl w-full max-w-md mx-4 p-6 relative">

    <button id="close-modal" class="absolute top-3 right-3 text-gray-400">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <h3 class="text-lg font-semibold text-white mb-4">
      Konsultasi via WhatsApp
    </h3>

    <form id="wa-form" class="space-y-4">
      <input
        id="wa-name"
        type="text"
        placeholder="{{ $wa.name_placeholder }}"
        required
        class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white"
      >

      <select
        id="wa-service"
        required
        class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white"
      >
        <option value="">Pilih layanan</option>
        {{ range $wa.services }}
          <option value="{{ . }}">{{ . }}</option>
        {{ end }}
      </select>

      <textarea
        id="wa-message"
        rows="4"
        placeholder="{{ $wa.message_placeholder }}"
        required
        class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white"
      ></textarea>

      <button
        type="submit"
        class="w-full flex items-center justify-center gap-2 bg-green-600 hover:bg-green-500 text-white font-semibold py-2 rounded"
      >
        <i data-lucide="send" class="w-4 h-4"></i>
        Kirim ke WhatsApp
      </button>
    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  if (window.lucide) lucide.createIcons();

  const modal = document.getElementById("contact-modal");
  const closeBtn = document.getElementById("close-modal");
  const triggers = document.querySelectorAll("[data-open-contact]");
  const form = document.getElementById("wa-form");

  const phone = "{{ .Site.Params.contact_whatsapp.number }}";
  const template = "{{ .Site.Params.contact_whatsapp.message_template }}";

  triggers.forEach(btn => {
    btn.onclick = () => {
      modal.classList.remove("hidden");
      modal.classList.add("flex");

      const selected = btn.dataset.selectedService;
      if (selected) document.getElementById("wa-service").value = selected;
    };
  });

  closeBtn.onclick = close;
  modal.onclick = e => { if (e.target === modal) close(); };

  function close() {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  }

  form.onsubmit = e => {
    e.preventDefault();

    const name = document.getElementById("wa-name").value.trim();
    const service = document.getElementById("wa-service").value;
    const message = document.getElementById("wa-message").value.trim();

    let text = template
      .replaceAll("[[name]]", name)
      .replaceAll("[[service]]", service)
      .replaceAll("[[message]]", message);

    window.open(
      "https://wa.me/" + phone + "?text=" + encodeURIComponent(text),
      "_blank"
    );

    close();
  };
  
});
</script>

</body>
</html>
