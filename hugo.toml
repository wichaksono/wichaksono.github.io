baseURL = "https://wichaksono.github.io/"
locale = "id"
title = "Wichaksono WP Developer"
enableRobotsTXT = true
# No tags/categories are used; without this Hugo publishes empty /tags/ and /categories/ pages.
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 6

# Tailwind CSS is compiled before Hugo runs (see "build" in package.json) into assets/css/app.css.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  # Icons and the web font come from node_modules (run `pnpm install` first).
  [[module.mounts]]
    source = "node_modules/lucide-static/icons"
    target = "assets/icons"
  [[module.mounts]]
    source = "node_modules/@fontsource-variable/inter/files"
    target = "assets/fonts"

[params]
  summary = ""
  # Social preview image, relative to static/ (1200x630).
  og_image = "images/og-card.png"
  og_locale = "id_ID"
  theme_color = "#0d1117"

[params.profile]
  name = "Wakhid Wicaksono"
  title = "Freelance Web Developer & Digital Marketer"
  quote = ""
  # Square photo inside assets/. Empty = initials avatar.
  photo = "images/profile.jpg"

# Primary call to action (hero, service pages, "Chat Me").
[params.cta]
  text = "Konsultasi Sekarang"
  url = "https://facebook.com/bocahapi"
  icon = "messages-square"

# When enabled, every CTA opens a WhatsApp form instead of params.cta.url.
[params.contact_whatsapp]
  enabled = false
  number = "6285117688663"

  name_label = "Nama"
  name_placeholder = "Nama Anda"
  service_label = "Layanan"
  message_label = "Pesan"
  message_placeholder = "Ceritakan kebutuhan Anda"

  message_template = "Halo, saya [[name]]\n\nLayanan: [[service]]\n\nPesan:\n[[message]]"

  services = [
    "Tambah Fungsi Custom",
    "Perbaikan Bug / Tema Konflik",
    "Perbaikan Tampilan Error",
    "Hapus Malware / Redirect Jahat",
    "Maintenance Website WordPress Bulanan",
    "Plugin WordPress Custom",
    "Lainnya"
  ]

# ======================
#  Profile links (icon row)
# ======================

[[params.links]]
  icon = "facebook"
  text = "Facebook"
  url = "https://www.facebook.com/bocahapi"
  newtab = true

[[params.links]]
  icon = "linkedin"
  text = "LinkedIn"
  url = "https://www.linkedin.com/in/wakhid-wicaksono-5514a369/"
  newtab = true

# YouTube is hidden until there is a channel URL (it pointed to "#").
# [[params.links]]
#   icon = "youtube"
#   text = "YouTube"
#   url = ""
#   newtab = true

[[params.links]]
  icon = "github"
  text = "GitHub"
  url = "https://github.com/wichaksono/"
  newtab = true

[[params.links]]
  icon = "circle-user"
  text = "Who I Am"
  url = "/about-me/"
  newtab = false

# ======================
#  My works section
# ======================
[[params.my_works]]
  label = "Karya Saya"
  description = "Daftar tempat saya berkarya:"
  active = true

# logo: a path inside assets/ (preferred) or a full URL.
[[params.my_works.items]]
  title = "Open-source & Free Resources"
  subtitle = "Kumpulan project dan eksperimen WordPress di GitHub"
  logo = "images/github-mark.png"
  url = "https://github.com/wichaksono/"

[[params.my_works.items]]
  title = "NeonWebID"
  subtitle = "Blogger di neon.web.id · aktif sejak 2015"
  logo = "images/neonwebid.png"
  url = "https://neon.web.id/author/wakhid-wicaksono/"

# ======================
#  Promotion section
# ======================
[[params.promotions]]
  label = "TOOLS & RESOURCE YANG SAYA GUNAKAN"
  active = false

[[params.promotions.items]]
  title = "Theme WordPress Ringan & Stabil"
  banner = "/images/tools/theme-co-id-banner.jpg"
  url = "https://theme.co.id"

[[params.promotions.items]]
  title = "Cloud Hosting untuk WordPress"
  banner = "/images/tools/warna-host-banner.jpg"
  url = "https://my.warnahost.com/?ref=2915"

# ======================
#  Bottom navigation (not shown on the home page)
#  The active item is detected from the current URL.
# ======================
[params.floatingnav]
  enabled = true

[[params.floatingnav.items]]
  icon = "house"
  label = "Home"
  url = "/"

[[params.floatingnav.items]]
  icon = "hammer"
  label = "Services"
  url = "/services/"

[[params.floatingnav.items]]
  icon = "circle-user"
  label = "About Me"
  url = "/about-me/"

[[params.floatingnav.items]]
  icon = "messages-square"
  label = "Chat Me"
  url = "https://facebook.com/bocahapi"
